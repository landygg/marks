name: Feature request
description: Propose a change. Explain the problem first; a large change with no prior agreement may not be merged.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
